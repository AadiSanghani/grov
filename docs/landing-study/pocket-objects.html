<style>
@font-face{font-family:Geist;src:url('../../app/fonts/geist-latin-wght-normal.woff2')}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:#192b29;font:17px/1.5 Geist,Arial,sans-serif;background:#ffdf56}header,.band,footer{padding-inline:max(6vw,calc((100vw - 1380px)/2))}header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #192b2940}.brand{font:600 37px/1 Georgia,serif;letter-spacing:-.06em}.brand small{display:inline-block;width:7px;height:7px;background:#2041cf;border-radius:50%;margin-left:4px}nav{display:flex;align-items:center;gap:30px}a{color:inherit;text-decoration:none}nav a{font-size:14px}a:focus-visible{outline:3px solid #2943cc;outline-offset:5px}.login{display:inline-flex;align-items:center;justify-content:center;gap:22px;background:#172f30;color:white;padding:12px 23px;border-radius:40px;font-weight:600;min-height:44px}.login span{font-size:20px;line-height:1}.band{position:relative;isolation:isolate;display:grid;grid-template-columns:1fr 1.07fr;align-items:center;column-gap:2%;min-height:min(820px,89svh);padding-block:64px 92px;overflow:hidden}.band:first-of-type{min-height:min(750px,calc(94svh - 76px))}.copy{position:relative;z-index:1}.kicker,.foot,.spec{font:500 12px/1.3 ui-monospace,Menlo,monospace}.kicker{display:flex;align-items:center;gap:10px}.kicker:before{content:'';width:26px;height:2px;background:currentColor}h1,h2{margin:26px 0 18px;font:500 clamp(54px,7.75vw,126px)/.89 Georgia,serif;letter-spacing:-.075em}h1 em,h2 em{font-weight:400}p{max-width:34ch;margin:22px 0 28px;font-size:clamp(16px,1.45vw,22px);line-height:1.45}.foot{position:absolute;bottom:20px;left:max(6vw,calc((100vw - 1380px)/2));right:max(6vw,calc((100vw - 1380px)/2));display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid #192b2955}.stage{position:relative;margin:0;perspective:1000px}.stage svg{width:100%;display:block;overflow:visible}.object{transform:translateY(var(--lift,0px)) rotateY(var(--turn,0deg));transform-origin:50% 55%;transform-box:view-box;transition:transform .12s linear}.float{transform:translateY(var(--float,0px));transition:transform .12s linear}.slip{margin:25px 0 4px;width:min(100%,325px);border-block:1px solid currentColor;padding:9px 0}.slip div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}.slip strong{font-variant-numeric:tabular-nums}.spec{opacity:.78}.reverse .stage{grid-column:1;grid-row:1}.reverse .copy{grid-column:2;padding-left:8%}.lav{background:#cec2ff}.mint{background:#b0e4c5}.pink{background:#ffa9a1}.blue{background:#c1d9ff}footer{background:#173b37;color:#fff1c1;display:flex;align-items:center;justify-content:space-between;gap:24px;padding-block:64px}footer h2{font-size:clamp(38px,6vw,92px);margin:0}footer .login{background:#ffdf56;color:#173b37}.off{position:absolute;left:-9999px}.off:focus{left:16px;top:12px;z-index:2;background:white}.stage text{font-family:Geist,Arial,sans-serif}.stage .serif{font-family:Georgia,serif}.stage .mono{font-family:Menlo,monospace}

<script>
const text=(x,y,words,size=15,fill='#183733',style='')=>`<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" ${style}>${words}</text>`;
const rect=(x,y,w,h,r,fill)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"/>`;
const path=(d,fill,attrs='')=>`<path d="${d}" fill="${fill}" ${attrs}/>`;
const group=(tr,art)=>`<g transform="${tr}">${art}</g>`;
const gradient=(id,stops)=>`<linearGradient id="${id}" x2=".85" y2="1" gradientUnits="objectBoundingBox">${stops.map(([at,col])=>`<stop offset="${at}" stop-color="${col}"/>`).join('')}</linearGradient>`;
const fills=gradient('leather',[[0,'#ffb58a'],[.11,'#ff845e'],[.51,'#f24b37'],[.83,'#e63b2e'],[1,'#b72c22']])+gradient('bronze',[[0,'#fff9ba'],[.27,'#ffde68'],[.57,'#e7a92b'],[.81,'#ffe584'],[1,'#b5771b']])+gradient('indigo',[[0,'#99b2ff'],[.3,'#5372e5'],[.85,'#2647bd'],[1,'#153185']])+gradient('paper',[[0,'#fffaeb'],[.6,'#f8f0d9'],[1,'#dfcfaa']])+gradient('green',[[0,'#a9e5ae'],[.3,'#5baa79'],[1,'#23694d']]);
const defs=`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${fills}<filter id="blur" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="8"/></filter><pattern id="grain" width="6" height="5" patternUnits="userSpaceOnUse"><path d="M1 2q1 -1 2 0m1 2h1" fill="none" stroke="#692019" stroke-opacity=".17" stroke-width=".65"/></pattern></defs></svg>`;
const token=()=>{let ridges='';for(let deg=0;deg<360;deg+=8)ridges+=group(`rotate(${deg})`,path('M0 -41v4','none','stroke="#ac7419" stroke-width="1.6"'));return `<circle cy="6" r="46" fill="#926015"/><circle cy="3" r="46" fill="#c28b20"/><circle r="46" fill="url(#bronze)" stroke="#ffed96" stroke-width="2"/>${ridges}<circle r="32" fill="none" stroke="#b78925" stroke-width="2"/>${text(0,15,'g',58,'#af761b','class="serif" text-anchor="middle"')}${text(-1,13,'g',58,'#ffe69a','class="serif" text-anchor="middle"')}`};
const paper=()=>{let edge='M0 0H152V181';for(let i=0;i<8;i++)edge+='l-9.5 -6 -9.5 6';return path(edge+'V0Z','url(#paper)')+text(15,33,'Grov',27,'#293a35','class="serif"')+text(15,55,'DAILY RECEIPT',10,'#39443c','class="mono"')+path('M15 68h122M15 116h122','none','stroke="#978d7c" stroke-dasharray="3 3"')+text(15,90,'Coffee',13)+text(136,90,'4.50',13,'#183733','text-anchor="end"')+text(15,109,'Train',13)+text(136,109,'3.25',13,'#183733','text-anchor="end"')+Array.from({length:34},(_,i)=>rect(18+i*3.2,135,1+(i*17%3),19,0,'#344039')).join('')};
const card=(color,label)=>rect(3,5,240,146,17,'#233852')+rect(0,0,240,146,17,color)+text(18,34,label,19,'#fff3d9','font-weight="600"')+rect(19,55,34,24,5,'url(#bronze)')+path('M20 67h32m-16 -11v23','none','stroke="#ad8d49"')+text(18,119,'••••   0142',17,'#fff3d9','class="mono"');
const wallet=()=>group('translate(74 159) rotate(-11 170 90) skewX(-5)',rect(4,0,303,174,29,'#993927')+rect(0,-4,299,170,26,'#f17b55')+group('translate(16 -34) rotate(-5)',card('url(#green)','Grov'))+group('translate(35 -52) rotate(5)',card('url(#indigo)','Grov'))+group('translate(151 -81) rotate(13) scale(.73)',paper())+rect(5,23,301,155,28,'#a73828')+rect(0,17,300,155,26,'url(#leather)')+rect(0,17,300,155,26,'url(#grain)')+`<rect x="8" y="24" width="284" height="140" rx="21" fill="none" stroke="#ffd0a0" stroke-width="2" stroke-dasharray="4 4" opacity=".86"/>`+text(24,138,'Grov',39,'#a7352a','class="serif"')+text(24,136,'Grov',39,'#ffe4bc','class="serif"')+rect(228,66,79,49,15,'#a53125')+rect(226,61,78,47,15,'url(#leather)')+`<circle cx="248" cy="84" r="12" fill="#b5452e"/><circle cx="247" cy="82" r="11" fill="url(#bronze)"/><circle cx="247" cy="82" r="7.5" fill="none" stroke="#c39431"/>`);
const hero=wallet()+`<g class="float">${group('translate(385 81) rotate(22) scale(.68 .74)',token())}${group('translate(63 269) rotate(-27) scale(.56 .72)',token())}</g>`;
const ledger=group('translate(99 143) rotate(-17) skewX(-4)',card('url(#green)','Everyday account'))+group('translate(184 57) rotate(13) scale(1.22)',paper())+group('translate(113 278) rotate(-17) scale(.5 .58)',token());
function wedge(start,end,top,side,dx,dy){const pt=(a,r,y)=>[210+r*Math.cos(a),169+y+r*.56*Math.sin(a)].join(' '),arc=(a,b,r,y,forward)=>`A${r} ${r*.56} 0 ${Math.abs(b-a)>Math.PI?1:0} ${forward} ${pt(b,r,y)}`,face=y=>`M${pt(start,121,y)}${arc(start,end,121,y,1)}L${pt(end,63,y)}${arc(end,start,63,y,0)}Z`;return group(`translate(${dx} ${dy})`,Array.from({length:32},(_,i)=>path(face(32-i),side)).join('')+path(face(0),top,'stroke="rgba(255,255,255,.5)" stroke-width="1.5"'))}
const report=group('rotate(-12 210 170)',wedge(Math.PI,1.68*Math.PI,'url(#green)','#28614a',-4,-5)+wedge(1.68*Math.PI,2*Math.PI,'url(#bronze)','#ba8228',9,-8)+wedge(0,Math.PI,'url(#indigo)','#354296',0,14))+group('translate(322 265) rotate(10) scale(.57)',token());
const tag=(color,city,code,num)=>path('M30 0H184Q199 0 199 15V110Q199 124 184 124H30L0 92V31Z','#304848','transform="translate(3 5)"')+path('M30 0H184Q199 0 199 15V110Q199 124 184 124H30L0 92V31Z',color)+`<circle cx="23" cy="62" r="7" fill="#293b40"/><circle cx="23" cy="62" r="4" fill="#ffa9a1"/>`+text(46,29,'GROV / TRIP '+num,10,'#fff3d8','class="mono"')+text(46,75,code,44,'#fff3d8','class="serif"')+text(47,103,city,14,'#fff3d8');
const trips=group('translate(84 169) rotate(13)',tag('url(#green)','Shared expenses','TRIP','02'))+group('translate(123 106) rotate(-15)',tag('url(#indigo)','Montréal','YUL','01'))+path('M143 159C70 117 55 162 82 197s52 16 42 5','none','stroke="#635238" stroke-width="6" stroke-linecap="round"')+path('M143 157C70 115 55 160 82 195s52 16 42 5','none','stroke="#edcb83" stroke-width="3"');
const stack=(x,y,n,top,edge)=>group(`translate(${x} ${y})`,Array.from({length:n},(_,i)=>`<ellipse cy="${-i*13}" rx="46" ry="22" fill="${edge}"/><path d="M-46 ${-i*13}v-8h92v8" fill="${edge}"/><ellipse cy="${-i*13-8}" rx="46" ry="22" fill="${top}" stroke="#fff6c5" stroke-opacity=".5"/>`).join(''));
const investments=stack(270,214,7,'url(#green)','#35704d')+stack(146,212,4,'url(#indigo)','#323b8e')+stack(200,259,3,'url(#bronze)','#ad7920')+group('translate(297 93) rotate(19) scale(.61 .69)',token());
const chapters=[['intro','','A pocket guide to Grov','Small change.<br><em>Big picture.</em>','See what you own, what you owe, and where your money goes.',hero,'01 / The pocket wallet','Your finances, unpacked',null],['ledger','lav reverse','01 / Transactions','Keep the<br><em>little details.</em>','Find the coffee, the train fare, or the transfer in your transaction history.',ledger,'02 / The paper trail','The daily ledger',[['Coffee','−$4.50'],['Train fare','−$3.25']]],['reports','mint','02 / Reports','Where did<br><em>it all go?</em>','Look at spending by category, then open one to see the transactions behind it.',report,'03 / The breakdown','Spending by category',[['Food & drink','$240'],['Transport','$120'],['Other','$120']]],['trips','pink reverse','03 / Trips','One trip.<br><em>Many tabs.</em>','Keep a trip’s transactions and shared expenses together, from the first train to the last dinner.',trips,'04 / The luggage tags','Montréal weekend',[['Dinner for two','$86.00'],['Your half','$43.00']]],['investments','blue','04 / Investments','What’s in<br><em>your mix?</em>','See your holdings, review your allocation, and follow portfolio performance over time.',investments,'05 / The portfolio','Portfolio allocation',[['Equities','55%'],['Funds','35%'],['Cash','10%']]]];
const main=document.querySelector('main');main.insertAdjacentHTML('beforebegin',defs);main.innerHTML=chapters.map(([id,cls,kicker,title,desc,art,caption,feature,rows],index)=>`<section id="${id}" class="band ${cls}"><div class="copy"><div class="kicker">${kicker}</div><${index?'h2':'h1'}>${title}</${index?'h2':'h1'}><p>${desc}</p>${rows?`<div class="slip">${rows.map(([label,value])=>`<div>${label}<strong>${value}</strong></div>`).join('')}</div><small class="spec">Illustrative figures</small>`:'<a class="login" href="https://www.grov-finance.com/sign-in">Log in <span>↗</span></a>'}</div><figure class="stage" aria-hidden="true"><svg viewBox="0 0 460 360"><ellipse cx="224" cy="313" rx="116" ry="9" opacity=".16" fill="#45402c" filter="url(#blur)"/><ellipse cx="226" cy="223" rx="205" ry="66" transform="rotate(-18 226 223)" fill="none" stroke="currentColor" opacity=".27" stroke-dasharray="2 5"/><g class="object">${art}</g></svg></figure><div class="foot"><span>${caption}</span><span>${index===0?'Scroll to unpack ↓':feature}</span></div></section>`).join('');
const motion=matchMedia('(prefers-reduced-motion: reduce)');const scenes=[...document.querySelectorAll('.band')];let queued=false;function update(){queued=false;for(const scene of scenes){const bounds=scene.getBoundingClientRect();if(bounds.bottom<0||bounds.top>innerHeight)continue;const phase=Math.max(-1,Math.min(1,(innerHeight/2-bounds.top-bounds.height/2)/innerHeight));scene.style.setProperty('--turn',`${phase*20}deg`);scene.style.setProperty('--lift',`${phase*-35}px`);scene.style.setProperty('--float',`${phase*-70}px`)}}function schedule(){if(!motion.matches&&!queued){queued=true;requestAnimationFrame(update)}}addEventListener('scroll',schedule,{passive:true});addEventListener('resize',schedule);motion.addEventListener('change',schedule);schedule();
</script></html>
